# Scrape config for platform/telemetry/prometheus.yaml. DNS service discovery, so Prometheus
# needs no Kubernetes API access: each name is a headless Service resolving to the targets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/alerts.yml]
scrape_configs:
  - job_name: gateway
    dns_sd_configs:
      - names: [ai-gateway-metrics.ai-gateway.svc.cluster.local]
        type: A
        port: 15020
  - job_name: hubble # one Cilium agent per node, on the host network
    dns_sd_configs:
      - names: [hubble-metrics.kube-system.svc.cluster.local]
        type: A
        port: 9965
