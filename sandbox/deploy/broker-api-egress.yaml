# Lets the broker reach the Kubernetes API (to claim sandboxes). A CiliumNetworkPolicy, because
# Cilium (ADR 0014) gives the API server its own identity: after Service translation it is the
# `host` or `remote-node` entity, which a NetworkPolicy ipBlock does not select. kube-apiserver
# names it whichever node it is on.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: code-executor-api
  namespace: tools
spec:
  endpointSelector:
    matchLabels:
      app: code-executor
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}]
