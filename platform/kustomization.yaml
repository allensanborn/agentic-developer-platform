apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - gateway/gateway.yaml
  - gateway/models.yaml
  - gateway/networkpolicy.yaml
  - gateway/egress-fqdn.yaml
  - gateway/guardrails.yaml
  - gateway/errors.yaml
  - models/ollama.yaml
  - models/scripted.yaml
  - agents/base.yaml
  - agents/research-agent.yaml
  - aws/floci.yaml
  - secrets/provider-keys.yaml
  - dapr/agents.yaml
  - autoscaling/vpa.yaml
  - telemetry/lgtm.yaml
  - telemetry/alertmanager.yaml
# Generated, so a rule or scrape change rolls Prometheus (the name carries a content hash).
configMapGenerator:
  - name: lgtm-prometheus
    namespace: telemetry
    files: [telemetry/lgtm-prometheus.yaml]
  - name: prometheus-rules
    namespace: telemetry
    files: [telemetry/alerts.yml]
  - name: grafana-alertmanager
    namespace: telemetry
    files: [telemetry/grafana-alertmanager.yaml]
  - name: alertmanager-config
    namespace: telemetry
    files: [telemetry/alertmanager.yml]
