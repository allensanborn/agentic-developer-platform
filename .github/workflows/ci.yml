# CI is one line on purpose: the pipeline lives in .dagger/ and runs identically on a laptop.
name: ci
on:
  pull_request:
  push:
    branches: [main] # a merge is checked as merged, not only as the PR's head (adp-lcd)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.11
          verb: call
          args: check
  # Every commit must carry a Developer Certificate of Origin sign-off (CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+>$' ||
              { echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"; fail=1; }
          done
          exit "$fail"
