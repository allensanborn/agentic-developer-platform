# Where Alertmanager delivers (alertmanager.yml): a generic webhook. This one logs each alert as
# a JSON line (alert-receiver.py); a real endpoint replaces the URL, not the route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: python:3.13-slim-bookworm@sha256:a5a7017efc5969e00ae2b91c8eb0631049a569652aa4ffc4501769049ae45c72
          command: ["python", "-I", "-u", "/app/alert-receiver.py"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: 8080}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap: {name: alert-receiver}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: telemetry
spec:
  selector:
    app: alert-receiver
  ports:
    - {name: http, port: 8080}
---
# In: Alertmanager only. Out: nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-receiver
  namespace: telemetry
spec:
  podSelector:
    matchLabels:
      app: alert-receiver
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 8080
