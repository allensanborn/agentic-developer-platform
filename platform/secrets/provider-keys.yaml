# Provider API keys live in AWS Secrets Manager and nowhere in git. External Secrets copies
# each one into the single namespace that needs it, in the shape the gateway reads, and
# re-reads it every minute, so rotating a key is one `scripts/provider-key.sh` call.
#
# floci accepts any credentials, so these are dummies. On AWS, delete this Secret and the
# `auth` block: the controller's ServiceAccount assumes a role (IRSA / Pod Identity) that
# may read only adp/providers/*.
apiVersion: v1
kind: Secret
metadata:
  name: floci-credentials
  namespace: ai-gateway
stringData:
  access-key: test
  secret-key: test
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: ai-gateway
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: floci-credentials
            key: secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-apikey
  namespace: ai-gateway
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: openrouter-apikey
  data:
    - secretKey: Authorization # the key agentgateway reads by default
      remoteRef:
        key: adp/providers/openrouter
