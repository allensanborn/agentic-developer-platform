apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - gateway/gateway.yaml
  - gateway/models.yaml
  - gateway/networkpolicy.yaml
  - gateway/egress-fqdn.yaml
  - gateway/guardrails.yaml
  - models/ollama.yaml
  - models/scripted.yaml
  - agents/base.yaml
  - agents/research-agent.yaml
  - aws/floci.yaml
  - secrets/provider-keys.yaml
  - dapr/agents.yaml
  - autoscaling/vpa.yaml
  - telemetry/jaeger.yaml
  - telemetry/prometheus.yaml
# Generated, so a rule or scrape change rolls Prometheus (the name carries a content hash).
configMapGenerator:
  - name: prometheus-config
    namespace: telemetry
    files: [telemetry/prometheus.yml]
  - name: prometheus-rules
    namespace: telemetry
    files: [telemetry/alerts.yml]
