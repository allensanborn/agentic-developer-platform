# Right-sizing for every platform workload. Requests only (controlledValues): VPA's default
# also rescales limits in proportion, which would shrink ollama's 6Gi limit to nothing and
# OOM-kill it once a model loads. min/max bound what VPA may choose; the floor keeps an idle
# workload schedulable and the ceiling keeps a runaway from taking the node.
# One replica of anything here is not highly available; VPA evicts only in mode Recreate or
# when an in-place resize is refused. Initial = stateful or slow to restart, never evicted.
# kube-system (coredns, metrics-server) is k3s-managed and left alone.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: research-agent
  namespace: agents
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: research-agent}
  updatePolicy: {updateMode: InPlaceOrRecreate}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: "2", memory: 1Gi}
---
