# What Dapr gives agents: durable workflow state behind a portable API. The agent code
# talks to "statestore"; that it is DynamoDB is this file's business, and swapping the
# backing service (Postgres, Cosmos DB, Redis) is a change here with no code change.
#
# floci accepts any credentials, so these are dummies. On AWS, delete the Secret and the
# two key fields: the sidecar picks up the pod's IAM role (IRSA / Pod Identity), scoped to
# this one table.
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: agents
stringData:
  access-key: test
  secret-key: test
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: agents
spec:
  type: state.aws.dynamodb
  version: v1
  metadata:
    - name: table
      value: adp-agent-state
    - name: region
      value: us-east-1
    - name: endpoint
      value: http://floci.aws.svc.cluster.local:4566
    - name: accessKey
      secretKeyRef:
        name: aws-credentials
        key: access-key
    - name: secretKey
      secretKeyRef:
        name: aws-credentials
        key: secret-key
    - name: actorStateStore # workflows are built on actors
      value: "true"
# Only this app's sidecar loads the component.
scopes:
  - research-agent
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: agents
  namespace: agents
spec:
  # No other app may invoke an agent unless a policy here says so.
  accessControl:
    defaultAction: deny
    trustDomain: public
  # The sidecar's own API serves only health (for the SDK's startup wait). A hijacked agent
  # cannot list components, read or write state, or call other apps or bindings through it
  # (adp-vba). Workflow is unaffected: it runs on durabletask's gRPC service, which the
  # allow-list does not filter. The list needs at least one gRPC rule that daprd recognises,
  # or it silently allows everything (an unknown name.version, e.g. "workflows v1" on 1.19,
  # maps to nothing). shutdown.v1 is that rule: it lets the app stop its own sidecar, which
  # it could do by exiting. smoke.sh calls GetState over gRPC to prove the list is live.
  api:
    allowed:
      - {name: shutdown, version: v1, protocol: grpc}
      - {name: healthz, version: v1.0, protocol: http}
