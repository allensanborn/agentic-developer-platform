# Where firing alerts go (alertmanager.yaml): a generic webhook. alert-receiver.yaml logs each
# alert as a JSON line; to deliver somewhere real (n8n, a ticketing hook), change the URL here and
# the egress rule in alertmanager.yaml. Resolved alerts are sent too, so the receiver sees both.
route:
  receiver: webhook
  group_by: [alertname, caller, source]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: webhook
    webhook_configs:
      - url: http://alert-receiver.telemetry.svc.cluster.local:8080/
        send_resolved: true
