# Detections (adp-0c0): logs and traces say what happened; these say something is wrong now.
# Shaped by GTIG/Mandiant's Layer 5 (Nov 2026): agentic intrusions arrive as valid identities
# moving at machine speed (ARTEX: 27 events in 23 s), so watch velocity and denials per
# identity, and treat a blocked egress attempt as a signal even when nothing got through.
# `caller` is the gateway's jwt.sub (frontend.metrics in platform/telemetry/lgtm.yaml);
# unauthenticated requests have none. Tested offline: alerts_test.yml (dagger call check).
groups:
  - name: gateway
    rules:
      - alert: GatewayTokenVelocity
        # ponytail: a fixed ceiling, not a per-caller baseline; learn baselines once there is
        # enough history to have one.
        expr: sum by (caller) (rate(agentgateway_gen_ai_client_token_usage_sum[5m])) * 60 > 20000
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.caller }} is using {{ $value | humanize }} tokens/min"
      - alert: GatewayDenialBurst
        # A burst of refusals: a credential being tried, or an agent probing what it may do.
        # The `or` arm catches a caller's first burst: increase() over a series with no earlier
        # sample is 0, so a brand-new identity's opening burst would otherwise be invisible.
        expr: >-
          sum by (caller, status) (increase(agentgateway_requests_total{status=~"401|403|429"}[1m])) >= 10
          or (sum by (caller, status) (agentgateway_requests_total{status=~"401|403|429"}) >= 10
              unless sum by (caller, status) (agentgateway_requests_total{status=~"401|403|429"} offset 1m))
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanize }} x HTTP {{ $labels.status }} for caller '{{ $labels.caller }}' in 1m"
      - alert: GatewayCallerDenied
        # A known identity asked for something it is not allowed: a model, a tool. Rare in
        # normal operation, so any occurrence is worth a look.
        # The fence probe is refused on purpose every run; its own alerts cover it.
        expr: sum by (caller) (increase(agentgateway_requests_total{status="403",caller!="system:serviceaccount:probes:fence-probe"}[5m])) > 0
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.caller }} was refused {{ $value | humanize }} time(s) in 5m"
  - name: egress
    rules:
      - alert: EgressPolicyDrop
        # Cilium dropped a connection a policy does not allow (Hubble). For the gateway or an
        # agent, that is an attempt to reach somewhere it was never meant to.
        # As above: a pod that is new, or new to being dropped, has no earlier sample, and its
        # first attempts are the ones that matter.
        # The fence probe's pods are dropped on purpose every run; FenceProbeFailed covers them.
        expr: >-
          sum by (source) (increase(hubble_drop_total{reason="POLICY_DENIED",source!~"probes/.*"}[5m])) > 0
          or (sum by (source) (hubble_drop_total{reason="POLICY_DENIED",source!~"probes/.*"}) > 0
              unless sum by (source) (hubble_drop_total{reason="POLICY_DENIED",source!~"probes/.*"} offset 5m))
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.source }} tried {{ $value | humanize }} connection(s) a policy denies"
  - name: fences
    rules:
      # The fence probe (ADR 0021, platform/probes/) reports fence_probe_ok per fence every 5 min.
      - alert: FenceProbeFailed
        # A deny that let something through, or an allow that was refused: either way the fence
        # is not what its check says.
        expr: min by (fence) (fence_probe_ok) == 0
        labels: {severity: critical}
        annotations:
          summary: "the {{ $labels.fence }} fence failed its probe"
      - alert: FenceProbeStale
        # No report for three intervals: the probe itself is broken, and so is the evidence.
        expr: >-
          absent_over_time(fence_probe_ok{fence="identity"}[15m])
          or absent_over_time(fence_probe_ok{fence="entitlement"}[15m])
          or absent_over_time(fence_probe_ok{fence="egress"}[15m])
        labels: {severity: warning}
        annotations:
          summary: "the {{ $labels.fence }} fence has not been probed for 15 minutes"
