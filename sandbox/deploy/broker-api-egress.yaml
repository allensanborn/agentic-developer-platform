# Lets the broker reach the Kubernetes API (to claim sandboxes) at the API server's actual
# address and port, which a NetworkPolicy sees after the Service is translated. Applied by
# scripts/sandbox-up.sh, which fills in __API_IP__ and __API_PORT__ from the `kubernetes`
# endpoints. Not in kustomization.yaml for that reason.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-executor-api
  namespace: tools
spec:
  podSelector:
    matchLabels:
      app: code-executor
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: __API_IP__/32
      ports:
        - port: __API_PORT__
