# Alertmanager for the rules Prometheus evaluates in the lgtm pod (ADR 0017). Prometheus-format
# rules plus Alertmanager is also the managed form's model (Grafana Cloud's Mimir ruler takes the
# same rule files), so alerts.yml and its promtool tests carry over unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address= # one replica: no gossip port
          ports:
            - {name: http, containerPort: 9093}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9093}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: telemetry
spec:
  selector:
    app: alertmanager
  ports:
    - {name: http, port: 9093}
---
# In: Prometheus (alerts) and Grafana (to show them), both in the lgtm pod. Out: DNS and the
# webhook receiver (alertmanager.yml), nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: telemetry
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lgtm
      ports:
        - port: 9093
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app: alert-receiver
      ports:
        - port: 8080
