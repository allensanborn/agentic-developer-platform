# The workshop's order tools (lab 3) as an MCP server, reachable only through the gateway.
# It holds the only credential for the orders table; the agents calling its tools hold none.
apiVersion: v1
kind: Namespace
metadata:
  name: tools
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-mcp
  namespace: tools
automountServiceAccountToken: false
---
# floci accepts any credentials, so these are dummies. On AWS, delete the Secret and the
# two key variables: boto3 picks up the pod's IAM role (IRSA / Pod Identity), scoped to
# the one table.
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: tools
stringData:
  access-key: test
  secret-key: test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-mcp
  namespace: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-mcp
  template:
    metadata:
      labels:
        app: orders-mcp
    spec:
      serviceAccountName: orders-mcp
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: adp/orders-mcp:dev
          imagePullPolicy: Never
          env:
            - {name: ORDERS_TABLE, value: adp-orders}
            - {name: AWS_REGION, value: us-east-1}
            - {name: AWS_ENDPOINT_URL, value: "http://floci.aws.svc.cluster.local:4566"} # delete on AWS
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aws-credentials, key: access-key}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aws-credentials, key: secret-key}}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: orders-mcp
  namespace: tools
spec:
  selector:
    app: orders-mcp
  ports:
    - port: 8080
---
# In: only the gateway. Out: DNS and the AWS (floci) endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-mcp
  namespace: tools
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: ai-gateway
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aws
          podSelector:
            matchLabels:
              app: floci
      ports:
        - port: 4566
---
# floci's own policy admits named namespaces; this adds `tools` (policies are additive).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: floci-from-tools
  namespace: aws
spec:
  podSelector:
    matchLabels:
      app: floci
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tools
      ports:
        - port: 4566
