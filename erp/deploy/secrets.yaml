# Database passwords live in Secrets Manager (floci here) as one JSON secret, generated by
# scripts/erp-up.sh and never written to disk or git. floci accepts any AWS credentials, so
# these are dummies; on AWS the store uses the controller's IAM role.
apiVersion: v1
kind: Secret
metadata:
  name: floci-credentials
  namespace: erp
stringData:
  access-key: test
  secret-key: test
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: erp
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: floci-credentials
            key: secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-db
  namespace: erp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: erp-db
    template:
      data:
        postgres-password: "{{ .superuser }}"
        executor-password: "{{ .executor }}"
        reader-password: "{{ .reader }}"
        # ponytail: no TLS to the database inside the cluster; add with the gateway TLS work (adp-vbi).
        reader-url: "postgresql://erp_reader:{{ .reader }}@chinook.erp.svc.cluster.local:5432/chinook?sslmode=disable"
        executor-url: "postgresql://erp_executor:{{ .executor }}@chinook.erp.svc.cluster.local:5432/chinook?sslmode=disable"
  dataFrom:
    - extract:
        key: adp/erp/db
