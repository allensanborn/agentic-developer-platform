# The tool hop: the gateway's `mcp` listener (platform/gateway/gateway.yaml) routes /mcp to
# the orders MCP server. Callers authenticate exactly as for models (caller-identity.yaml
# targets the whole Gateway): their ServiceAccount token, audience ai-gateway.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: orders-mcp
  namespace: ai-gateway
spec:
  mcp:
    targets:
      - name: orders
        static:
          host: orders-mcp.tools.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: ai-gateway
spec:
  parentRefs:
    - name: ai-gateway
      sectionName: mcp
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: orders-mcp
---
# Which identity may use which tool: the workshop's lab 4 matrix with workload identities
# for its personas. A tool no rule allows is not refused when called; it is absent from the
# caller's tools/list, so a model never learns it exists.
#   lookup_order     any authenticated caller
#   initiate_return  research-agent only
#   check_inventory  nobody (deliberately unmapped: deny-by-default)
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: orders-mcp-tools
  namespace: ai-gateway
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: orders-mcp
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'mcp.tool.name == "lookup_order"'
            - 'mcp.tool.name == "initiate_return" && jwt.sub == "system:serviceaccount:agents:research-agent"'
---
# The gateway's own policy (platform/gateway/networkpolicy.yaml) covers the llm listener;
# these add the mcp listener: in from client namespaces on 8081, out to the tools server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-gateway-mcp
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ai-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              adp.dev/ai-gateway-client: "true"
      ports:
        - port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tools
          podSelector:
            matchLabels:
              app: orders-mcp
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress-mcp
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: ai-gateway
      ports:
        - port: 8081
