# Traces (adp-bio): who called what, with which tokens and latency, and which provider
# answered. The gateway exports a span per model and tool call carrying gen_ai.* attributes
# and the caller's jwt.sub; the agent exports a span per workflow activity and sends
# `traceparent`, so the gateway's span nests under the agent's.
#
# Jaeger v2 is an OpenTelemetry Collector distribution: one container receives OTLP and
# serves the query API, so there is no separate collector. In-memory storage: traces do not
# survive a restart. ponytail: swap the storage (or put a collector in front) when traces
# must outlive the pod.
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: query, containerPort: 16686}
          readinessProbe:
            httpGet:
              path: /
              port: 16686
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: telemetry
spec:
  selector:
    app: jaeger
  ports:
    - {name: otlp-grpc, port: 4317, appProtocol: grpc}
    - {name: otlp-http, port: 4318}
    - {name: query, port: 16686}
---
# In: the gateway's OTLP/gRPC and the agents' OTLP/HTTP. Nobody reaches the query port from
# inside the cluster; read traces with a port-forward. Out: nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
  namespace: telemetry
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: ai-gateway
      ports:
        - port: 4317
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
      ports:
        - port: 4318
---
# The gateway's tracing policy lives in ai-gateway and points at a Service here.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tracing
  namespace: telemetry
spec:
  from:
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: ai-gateway
  to:
    - group: ""
      kind: Service
      name: jaeger
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tracing
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  frontend:
    tracing:
      backendRef:
        kind: Service
        name: jaeger
        namespace: telemetry
        port: 4317
      # Trace every call, including ones that arrive without a traceparent.
      randomSampling: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-gateway-telemetry
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ai-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry
          podSelector:
            matchLabels:
              app: jaeger
      ports:
        - port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress-telemetry
  namespace: agents
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry
          podSelector:
            matchLabels:
              app: jaeger
      ports:
        - port: 4318
