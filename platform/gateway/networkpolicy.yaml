# The gateway's data plane. In: only namespaces labelled as clients. Out: DNS, its
# control plane, the local models, and nothing else in-cluster.
# Hosted providers are allowed by name, not by IP range: egress-fqdn.yaml (ADR 0014).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-gateway
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ai-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              adp.dev/ai-gateway-client: "true"
      ports:
        - port: 8080
    - from: # Prometheus, in the lgtm pod, scrapes the metrics port (platform/telemetry/lgtm.yaml)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry
          podSelector:
            matchLabels:
              app: lgtm
      ports:
        - port: 15020
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: models
      ports:
        - port: 11434
