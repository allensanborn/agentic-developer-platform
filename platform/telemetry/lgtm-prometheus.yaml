# Prometheus inside the lgtm pod (lgtm.yaml), mounted over the image's /otel-lgtm/prometheus.yaml.
# The first block is upstream's default for grafana/otel-lgtm 0.40.0, kept as is: it is how OTLP
# metrics from the Collector become labels. Ours follows: scrape jobs, rules, Alertmanager.
global:
  scrape_native_histograms: true
  scrape_interval: 15s
  evaluation_interval: 15s
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
    - k8s.namespace.name
    - k8s.pod.name
storage:
  tsdb:
    out_of_order_time_window: 10m

# DNS service discovery, so Prometheus needs no Kubernetes API access: each name is a headless
# Service resolving to the targets.
scrape_configs:
  - job_name: gateway
    dns_sd_configs:
      - names: [ai-gateway-metrics.ai-gateway.svc.cluster.local]
        type: A
        port: 15020
  - job_name: hubble # one Cilium agent per node, on the host network
    dns_sd_configs:
      - names: [hubble-metrics.kube-system.svc.cluster.local]
        type: A
        port: 9965
rule_files: [/otel-lgtm/rules/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager.telemetry.svc.cluster.local:9093]
